<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование маршрута</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; padding: 15px; background: #f0f2f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h2 { color: #4a7a8c; margin-bottom: 15px; font-size: 18px; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .row > div { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 7px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; }
        .buttons { display: flex; gap: 10px; margin-top: 15px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-close { background: #f44336; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Редактирование маршрута</h2>
        
<div class="row">
    <div><label>Дата:</label><input type="text" id="date" placeholder="ДД.ММ.ГГГГ"></div>
    <div><label>Дата вып.:</label><input type="text" id="completionDate" placeholder="ДД.ММ.ГГГГ"></div>
    <div><label>Статус:</label>
        <select id="status" style="padding:7px;">
            <option value="Активно">Активно</option>
            <option value="Ожидание">Ожидание</option>
            <option value="Выполнено">Выполнено</option>
        </select>
    </div>
</div>
<div class="row">
    <div><label>Приоритет:</label>
        <select id="priority">
            <option value="0">Обычный</option>
            <option value="1">⭐ Высокий</option>
        </select>
    </div>
    <div><label>Откуда:</label><input type="text" id="from"></div>
    <div><label>Куда:</label><input type="text" id="to"></div>
</div>
        
        <label>Задача:</label>
        <textarea id="task" rows="3"></textarea>
        
        <label>Примечание:</label>
        <textarea id="note" rows="2"></textarea>
        
        <label>Внутр. комм.:</label>
        <textarea id="internalComment" rows="2"></textarea>
        
        <div class="buttons">
            <button onclick="save()" class="btn-save">Сохранить</button>
            <button onclick="window.close()" class="btn-close">Закрыть</button>
        </div>
    </div>
    <script src="edit.js"></script>
</body>
</html>
